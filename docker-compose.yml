services:
  server:
    build:
      context: .
      dockerfile: config/Dockerfile
    image: gotic-tac:latest
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: "/data/gotic.db"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me-before-deploying}"
      TOKEN_TTL: "${TOKEN_TTL:-24h}"
    volumes:
      - gotic-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  gotic-data:
